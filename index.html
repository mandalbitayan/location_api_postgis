<!doctype html>
<html>
  <head>
    <title>GIS Location Map</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      #map {
        height: 600px;
      }
    </style>
  </head>

  <body>
    <h2>GIS Location Map</h2>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      const map = L.map("map").setView([20.5937, 78.9629], 5);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(
        map,
      );

      // fetch all locations 

      fetch("http://localhost:3000/api/locations")
        .then((response) => response.json())
        .then((data) => {
          L.geoJSON(data).addTo(map);
        })
        .catch((error) => {
          console.error(error);
        });

      // fetch nearby search

      fetch("https://localhost:3000/api/locations/nearby?lat=17.385&lng=78.4867&radius=5000")
      .then((response) => response.json())
      .then((data)=>{
        L.geoJSON(data).addTo(map)
      })
      .catch((error)=>{
        console.error(error)
      });
      
    </script>
  </body>
</html>
